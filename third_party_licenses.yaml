# Licenses of the shipped files that are not pub packages (fonts, shaders, data).
# After changing this file, a shader header or a dependency, run: dart run tool/generate_licenses.dart
#
# Every shipped shader and font and every file in the `checked` asset folders must be covered:
# - shaders declare `SPDX-FileCopyrightText` and `SPDX-License-Identifier` lines in their header;
#   third-party shaders also need an entry below (name, description, url), without copyright and license,
# - other files are listed under `own` (part of KPix) or in a `third_party` entry.
# License texts live in LICENSES/<SPDX id>.txt. NOASSERTION (no license stated) requires a notice.

checked:
  - fonts/
  - color_names/

own:
  - fonts/KPix.ttf
  - fonts/*.svg

third_party:
