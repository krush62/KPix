name: Create Codeberg Release

on:
  workflow_dispatch:
    inputs:
      codeberg_draft:
        description: "Create the Codeberg release as draft"
        type: boolean
        default: true

permissions:
  contents: read

env:
  GITHUB_OWNER: krush62
  GITHUB_REPO: KPix
  CODEBERG_OWNER: krush62
  CODEBERG_REPO: KPix
  CODEBERG_API: https://codeberg.org/api/v1
  CODEBERG_DRAFT: ${{ inputs.codeberg_draft }}

jobs:
  codeberg_release:
    name: Mirror Latest GitHub Release to Codeberg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read latest GitHub release metadata
        id: latest_release
        shell: bash
        run: |
          set -euo pipefail

          gh release view \
            --repo "${GITHUB_OWNER}/${GITHUB_REPO}" \
            --json tagName,name,body,isDraft,isPrerelease,url \
            > github-release.json

          tag_name="$(jq -r '.tagName // empty' github-release.json)"
          release_name="$(jq -r '.name // empty' github-release.json)"
          release_url="$(jq -r '.url // empty' github-release.json)"
          is_draft="$(jq -r '.isDraft // false' github-release.json)"

          if [ -z "${tag_name}" ]; then
            echo "Could not determine latest GitHub release tag."
            cat github-release.json
            exit 1
          fi

          if [ "${is_draft}" = "true" ]; then
            echo "The latest GitHub release is still a draft:"
            echo "${release_url}"
            echo "Please publish the GitHub release first."
            exit 1
          fi

          if [ -z "${release_name}" ] || [ "${release_name}" = "null" ]; then
            release_name="KPix ${tag_name}"
          fi

          echo "Latest GitHub release:"
          echo "  tag: ${tag_name}"
          echo "  name: ${release_name}"
          echo "  url: ${release_url}"

          {
            echo "tag_name=${tag_name}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether Codeberg release already exists
        shell: bash
        env:
          TAG_NAME: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          set -euo pipefail

          auth_header="Authorization: token ${{ secrets.CODEBERG_TOKEN }}"
          repo_api="${CODEBERG_API}/repos/${CODEBERG_OWNER}/${CODEBERG_REPO}"

          http_status="$(curl -sS \
            -o /tmp/codeberg-existing-release.json \
            -w "%{http_code}" \
            -H "${auth_header}" \
            -H "Accept: application/json" \
            "${repo_api}/releases/tags/${TAG_NAME}")"

          if [ "${http_status}" = "200" ]; then
            echo "A Codeberg release for tag ${TAG_NAME} already exists."
            echo "Aborting to avoid modifying an existing release."
            cat /tmp/codeberg-existing-release.json
            exit 1
          fi

          if [ "${http_status}" = "404" ]; then
            echo "No Codeberg release for tag ${TAG_NAME} exists yet. Continuing."
            exit 0
          fi

          echo "Unexpected response from Codeberg while checking release:"
          echo "HTTP status: ${http_status}"
          cat /tmp/codeberg-existing-release.json
          exit 1

      - name: Verify release tag exists on GitHub
        shell: bash
        env:
          TAG_NAME: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          if ! git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} does not exist on GitHub."
            echo "The GitHub release must be published and backed by a real Git tag."
            exit 1
          fi

          echo "Found GitHub tag ${TAG_NAME}."

      - name: Download GitHub release assets
        shell: bash
        env:
          TAG_NAME: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p release-assets

          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_OWNER}/${GITHUB_REPO}" \
            --dir release-assets \
            --clobber

          echo "Downloaded release assets:"
          find release-assets -type f -print

      - name: Configure SSH for Codeberg
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CODEBERG_SSH_KEY }}

      - name: Add Codeberg host key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

      - name: Add Codeberg remote
        shell: bash
        run: |
          set -euo pipefail

          git remote add codeberg git@codeberg.org:${CODEBERG_OWNER}/${CODEBERG_REPO}.git

      - name: Push release tag to Codeberg
        shell: bash
        env:
          TAG_NAME: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          set -euo pipefail

          git push codeberg "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

      - name: Create Codeberg release
        shell: bash
        env:
          TAG_NAME: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          set -euo pipefail

          auth_header="Authorization: token ${{ secrets.CODEBERG_TOKEN }}"
          repo_api="${CODEBERG_API}/repos/${CODEBERG_OWNER}/${CODEBERG_REPO}"

          release_name="$(jq -r '.name // empty' github-release.json)"
          release_body="$(jq -r '.body // ""' github-release.json)"
          prerelease="$(jq -r '.isPrerelease // false' github-release.json)"

          if [ -z "${release_name}" ] || [ "${release_name}" = "null" ]; then
            release_name="KPix ${TAG_NAME}"
          fi

          create_payload="$(jq -n \
            --arg tag "${TAG_NAME}" \
            --arg name "${release_name}" \
            --arg body "${release_body}" \
            --argjson draft "${CODEBERG_DRAFT}" \
            --argjson prerelease "${prerelease}" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: $draft,
              prerelease: $prerelease
            }')"

          created_release_json="$(curl -sS -X POST \
            -H "${auth_header}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "${create_payload}" \
            "${repo_api}/releases")"

          release_id="$(echo "${created_release_json}" | jq -r '.id // empty')"

          if [ -z "${release_id}" ]; then
            echo "Failed to create Codeberg release."
            echo "${created_release_json}"
            exit 1
          fi

          echo "Created Codeberg release with ID: ${release_id}"
          echo "release_id=${release_id}" >> "$GITHUB_ENV"

      - name: Upload assets to Codeberg release
        shell: bash
        run: |
          set -euo pipefail

          auth_header="Authorization: token ${{ secrets.CODEBERG_TOKEN }}"
          repo_api="${CODEBERG_API}/repos/${CODEBERG_OWNER}/${CODEBERG_REPO}"

          if ! find release-assets -type f | grep -q .; then
            echo "No release assets found. Nothing to upload."
            exit 0
          fi

          find release-assets -type f | while read -r file; do
            asset_name="$(basename "$file")"
            encoded_name="$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))' "$asset_name")"

            echo "Uploading asset: ${asset_name}"

            curl -sS -X POST \
              -H "${auth_header}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${file}" \
              "${repo_api}/releases/${release_id}/assets?name=${encoded_name}"

            echo
          done